<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>CollegeDB — управление колледжем</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="brand-mark">C</div>
      <div><p class="eyebrow">УЧЕБНАЯ СИСТЕМА</p><h1>College<span>DB</span></h1><p class="subtitle">Управление данными колледжа</p></div>
      <div class="db-status"><span></span> Локальная база данных</div>
    </header>
    <main>
      <div class="heading-row"><div><p class="eyebrow">СПРАВОЧНИКИ</p><h2 id="sectionTitle">Студенты</h2></div><button id="refresh" class="icon-button" title="Обновить список" aria-label="Обновить">↻</button></div>
      <nav id="tabs" class="tabs" aria-label="Разделы"></nav>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section class="panel">
        <div class="panel-head"><div><p class="eyebrow">КОЛЛЕКЦИЯ</p><h3 id="listTitle">Список студентов</h3></div><span id="count" class="count">0 записей</span></div>
        <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div id="empty" class="empty" hidden><span>▤</span><p>Записей пока нет</p><small>Добавьте первую запись с помощью формы ниже.</small></div></div>
      </section>
      <section class="panel editor">
        <div class="panel-head"><div><p class="eyebrow">УПРАВЛЕНИЕ</p><h3 id="formTitle">Новая запись</h3></div></div>
        <form id="editorForm"><div id="fields" class="fields"></div><div class="form-actions"><button id="save" class="primary" type="submit">Добавить запись</button><button id="cancel" class="secondary" type="button" hidden>Отмена</button></div></form>
      </section>
    </main>
    <footer>CollegeDB <span>•</span> ASP.NET Core + Entity Framework Core</footer>
  </div>
  <script src="/js/routers.js"></script>
</body>
</html>
